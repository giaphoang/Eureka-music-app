[tool.ruff]
target-version = "py310"
line-length = 120
src = ["client", "server"]
extend-exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    "data",
    "models",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"client/test_*.py" = ["B011"]
"server/tests/test_*.py" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = [
    "client/eureka_client",
    "server/app",
    "server/scripts",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = [
    "client",
    "server/tests",
]
pythonpath = [
    "client",
    "server",
]
